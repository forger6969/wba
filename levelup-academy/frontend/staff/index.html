<!doctype html>
<html lang="ru" data-theme="levelup">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Only /login is public and indexable. Everything behind it is private — kept out
      of the index by robots.txt (Disallow all but /login) and the X-Robots-Tag header
      (vercel.json, noindex on every path except /login). No meta robots here: it is a
      single-page app, one index.html for every route, so a static tag could not target
      only the login page.
    -->
    <meta
      name="description"
      content="Вход в панель управления World Bridge Academy для сотрудников учебного центра: администратор, CEO, ментор и методист."
    />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="canonical" href="https://wbalc.uz/login" />

    <!-- Ссылку на вход рассылают сотрудникам в Telegram — там карточка
         предпросмотра и решает, откроют её или примут за фишинг. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="World Bridge Academy" />
    <meta property="og:title" content="World Bridge Academy — вход" />
    <meta
      property="og:description"
      content="Единый вход: сотрудники — в панель управления, ученики и родители — в личный кабинет."
    />
    <meta property="og:url" content="https://wbalc.uz/login" />
    <meta property="og:image" content="https://wbalc.uz/wba-logo.png" />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#dc2626" />
    <title>Вход — World Bridge Academy для сотрудников</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
