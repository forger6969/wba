<!doctype html>
<html lang="ru" data-theme="levelup">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Only /login is public and indexable. The cabinet behind it holds personal
      student/parent data and stays out of the index via robots.txt (Disallow all but
      /login) and the X-Robots-Tag header (vercel.json, noindex on every path except
      /login). No meta robots here: single index.html for every SPA route, so a static
      tag could not target only the login page.
    -->
    <meta
      name="description"
      content="Вход в личный кабинет World Bridge Academy для учеников и родителей — по логин-коду и паролю."
    />
    <!-- В отличие от панели сотрудников здесь индексировать нечего ВООБЩЕ:
         кабинет живёт под /kabinet/, своей формы входа у него больше нет
         (единый вход в корне сайта), а за ней — только личные данные учеников.
         Поэтому статический noindex здесь уместен: он покрывает все роуты
         кабинета и не зависит от заголовков. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <meta name="theme-color" content="#dc2626" />
    <title>World Bridge Academy — o‘quvchi va ota-ona</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
